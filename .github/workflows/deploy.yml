name: Deploy to Production VPS

on:
  push:
    branches: [ main ]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  linting-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Typecheck
        run: npx tsc --noEmit
      - name: Run Linter
        run: npm run lint
  build-and-push:
    name: Build and Push Docker Image
    needs: linting-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in into Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/next-server:latest
          build-args: |
            DATABASE_URL=postgresql://postgres:password@localhost:5432/svibes_db?schema=public
  deploy:
    name: Deploy to Production VPS
    needs: build-and-push
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/apps/svibes/telebot
            git pull
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T next-server npx prisma migrate deploy || echo "Migrations skipped or service name needs adjustment"
            docker compose ps
      - name: Send Telegram Notification Success
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Успешный деплой на продакшн!
            📦 Репозиторий: ${{ github.repository }}
            👤 Автор: ${{ github.actor }}
            🔗 Коммит: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
      - name: Send Telegram Notification on Failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Ошибка при деплое на продакшн!
            🔍 Проверьте логи: https://github.com/${{ github.repository }}/actions
            
